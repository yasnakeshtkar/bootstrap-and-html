<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitbarg</title>
    <!-- Bootstrap 5 RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
        }

        /* لوگو شبیه گوگل */
        .logo-text {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: -1px;
        }
        .logo-text .b1 { color: #4285F4; }
        .logo-text .i  { color: #EA4335; }
        .logo-text .t  { color: #FBBC05; }
        .logo-text .b2 { color: #4285F4; }
        .logo-text .a  { color: #34A853; }
        .logo-text .r  { color: #EA4335; }
        .logo-text .g  { color: #FBBC05; }

        .navbar {
            background-color: #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .nav-link {
            color: #333 !important;
            font-weight: 500;
        }

        .btn-login {
            background-color: #0d6efd;
            color: white;
            border-radius: 8px;
            padding: 8px 20px;
            font-weight: 500;
        }

        .card-box {
            max-width: 520px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            padding: 24px;
        }

        .nav-pills .nav-link {
            color: #6c757d;
            font-weight: 500;
            border-radius: 8px;
            padding: 8px 24px;
        }
        .nav-pills .nav-link.active {
            background-color: #0d6efd;
            color: white !important;
        }

        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px 16px;
            border: 1px solid #dee2e6;
        }

        .btc-icon {
            width: 22px;
            height: 22px;
            background: #F7931A;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .btn-buy {
            background-color: #0d6efd;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            width: 100%;
        }
        .btn-buy:hover {
            background-color: #0b5ed7;
        }

        .price-input {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #212529;
        }
    </style>
</head>
<body>

<!-- نوار بالا -->
<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2">
            <div style="width:28px;height:28px;background:linear-gradient(135deg,#4285F4,#34A853,#FBBC05,#EA4335);border-radius:6px;"></div>
            <span class="fw-bold fs-5">Bitbarg</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1">
                <li class="nav-item"><a class="nav-link" href="#">خانه</a></li>
                <li class="nav-item"><a class="nav-link" href="#">قیمت لحظه‌ای</a></li>
                <li class="nav-item"><a class="nav-link" href="#">کارمزدها</a></li>
                
            </ul>
            
        </div>
        <div class="d-flex align-items-center gap-3">
    <!-- آیکون زنگوله -->
    <i class="fas fa-bell" style="font-size: 22px; color: #333; cursor: pointer;"></i>
    
    <!-- دکمه ورود / ثبت نام -->
    <button class="btn btn-login">ورود / ثبت نام</button>
</div>

    
       
    </div>
</nav>

<!-- محتوای اصلی -->
<div class="container py-5">
    <!-- لوگو بزرگ وسط صفحه -->
    <div class="text-center mb-5">
        <div class="logo-text">
            <span class="b1">B</span><span class="i">i</span><span class="t">t</span><span class="b2">b</span><span class="a">a</span><span class="r">r</span><span class="g">g</span>
        </div>
    </div>

    <!-- باکس خرید/فروش -->
    <div class="card-box">
        <!-- تب‌ها -->
        <ul class="nav nav-pills justify-content-center mb-4" id="tradeTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="buy-tab" data-bs-toggle="pill" data-bs-target="#buy" type="button">خرید</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="sell-tab" data-bs-toggle="pill" data-bs-target="#sell" type="button">فروش</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="convert-tab" data-bs-toggle="pill" data-bs-target="#convert" type="button">تبدیل</button>
            </li>
        </ul>

        <div class="tab-content">
            <!-- تب خرید -->
            <div class="tab-pane fade show active" id="buy">
                <div class="row g-3 mb-3">
                    <div class="col-12">
                        <label class="form-label text-muted small">انتخاب ارز</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white">
                                <span class="btc-icon">₿</span>
                            </span>
                            <select class="form-select">
                                <option selected>بیت کوین (BTC)</option>
                                <option>اتریوم (ETH)</option>
                                <option>تتر (USDT)</option>
                                <option>ریپل (XRP)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label text-muted small">مقدار</label>
                        <input type="number" class="form-control" value="1" step="0.0001">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small">تومان</label>
                        <input type="text" class="form-control price-input" value="۱۴,۳۲۳,۲۱۶,۴۵۰" readonly>
                    </div>
                </div>

                <button class="btn btn-primary btn-buy">
                    خرید ارز
                </button>
            </div>

            <!-- تب فروش -->
            <div class="tab-pane fade" id="sell">
                <div class="text-center py-4 text-muted">
                    <i class="bi bi-currency-exchange fs-1"></i>
                    <p class="mt-2">بخش فروش (مشابه خرید)</p>
                </div>
            </div>

            <!-- تب تبدیل -->
            <div class="tab-pane fade" id="convert">
                <div class="text-center py-4 text-muted">
                    <i class="bi bi-arrow-left-right fs-1"></i>
                    <p class="mt-2">بخش تبدیل (مشابه خرید)</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
